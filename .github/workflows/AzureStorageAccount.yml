name: Azure PostgreSQL Backup and Safe Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      resource_group_name:
        description: 'Name of the Azure Resource Group'
        required: true
        default: 'AllResourcesmain'
        type: choice
        options:
          - AllResourcesmain

      storage_account_name:
        description: 'Name of the Azure Storage Account'
        required: true
        default: 'examplestoraccountgcqddq'
        type: choice
        options:
          - examplestoraccountgcqddq

      container_name:
        description: 'Name of the Azure Storage Container'
        required: true
        default: 'vhds'
        type: choice
        options:
          - vhds

      postgres_host:
        description: 'Hostname of the Azure PostgreSQL Flexible Server'
        required: true
        default: 'example-psqlflexibleserver-dg61sq.postgres.database.azure.com'
        type: choice
        options:
          - example-psqlflexibleserver-dg61sq.postgres.database.azure.com

      postgres_port:
        description: 'Port number for PostgreSQL'
        required: true
        default: '5432'

      postgres_database:
        description: 'PostgreSQL Database Name'
        required: true
        default: 'exampledb'
        type: choice
        options:
          - exampledb

      postgres_username:
        description: 'PostgreSQL Username'
        required: true
        default: 'psqladmin'
        type: choice
        options:
          - psqladmin

jobs:
  backup-and-destroy:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    outputs:
      backup_file: ${{ steps.generate-backup.outputs.backup_file }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Required Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            postgresql-client \
            zip \
            netcat-openbsd \
            dnsutils

      - name: Verify DNS Resolution
        run: |
          nslookup ${{ github.event.inputs.postgres_host }}

      - name: Verify PostgreSQL Connectivity
        run: |
          nc -zv \
            ${{ github.event.inputs.postgres_host }} \
            ${{ github.event.inputs.postgres_port }}

      - name: Generate Backup File Name
        id: generate-backup
        run: |
          DATE=$(date +%Y%m%d%H%M%S)

          BACKUP_FILE="${{ github.event.inputs.postgres_database }}-${DATE}.zip"

          echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT

      - name: Create PostgreSQL Backup
        env:
          POSTGRES_HOST: ${{ github.event.inputs.postgres_host }}
          POSTGRES_PORT: ${{ github.event.inputs.postgres_port }}
          POSTGRES_DATABASE: ${{ github.event.inputs.postgres_database }}
          POSTGRES_USERNAME: ${{ github.event.inputs.postgres_username }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require

        run: |
          mkdir -p backup

          pg_dump \
            --host=$POSTGRES_HOST \
            --port=$POSTGRES_PORT \
            --username=$POSTGRES_USERNAME \
            --dbname=$POSTGRES_DATABASE \
            --format=custom \
            --verbose \
            --no-owner \
            --file=backup/database.dump

          zip -r \
            ${{ steps.generate-backup.outputs.backup_file }} \
            backup

      - name: Verify Backup ZIP
        run: |
          ls -lh
          unzip -l ${{ steps.generate-backup.outputs.backup_file }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup
          path: ${{ steps.generate-backup.outputs.backup_file }}
          retention-days: 7

      - name: Upload Backup to Azure Blob Storage
        uses: azure/cli@v1
        with:
          inlineScript: |
            az storage blob upload \
              --account-name ${{ github.event.inputs.storage_account_name }} \
              --container-name ${{ github.event.inputs.container_name }} \
              --name ${{ steps.generate-backup.outputs.backup_file }} \
              --file ${{ steps.generate-backup.outputs.backup_file }} \
              --overwrite true \
              --auth-mode login

      - name: Verify Blob Upload
        uses: azure/cli@v1
        with:
          inlineScript: |
            az storage blob list \
              --account-name ${{ github.event.inputs.storage_account_name }} \
              --container-name ${{ github.event.inputs.container_name }} \
              --auth-mode login \
              --output table

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: backup-and-destroy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Destroy Placeholder
        run: |
          echo "PostgreSQL backup completed successfully."
          echo "Terraform destroy can start safely."