name: Azure PostgreSQL Backup and Safe Terraform Destroy

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP_NAME: "AllResourcesmain"

  STORAGE_ACCOUNT_NAME: "examplestoraccount"
  CONTAINER_NAME: "vhds"

  POSTGRES_HOST: "example-psqlflexibleserver.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "exampledb"
  POSTGRES_USERNAME: "psqladmin"

jobs:
  backup-and-destroy:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    outputs:
      backup_file: ${{ steps.generate-backup.outputs.backup_file }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install PostgreSQL Client and Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client zip

      - name: Generate Backup File Name
        id: generate-backup
        run: |
          DATE=$(date +%Y%m%d%H%M%S)
          BACKUP_FILE="${{ env.POSTGRES_DATABASE }}-${DATE}.zip"

          echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT

      - name: Create PostgreSQL Backup
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
        run: |
          mkdir -p backup

          pg_dump \
            --host=${{ env.POSTGRES_HOST }} \
            --port=${{ env.POSTGRES_PORT }} \
            --username=${{ env.POSTGRES_USERNAME }} \
            --dbname=${{ env.POSTGRES_DATABASE }} \
            --format=c \
            --verbose \
            --file=backup/postgres-backup.dump

          zip -r postgres-backup.zip backup

      - name: Get Storage Account Key
        id: storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --query "[0].value" \
            -o tsv)

          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Upload Backup to Azure Blob Storage
        run: |
          az storage blob upload \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --account-key "${{ env.STORAGE_KEY }}" \
            --container-name "${{ env.CONTAINER_NAME }}" \
            --name "${{ steps.generate-backup.outputs.backup_file }}" \
            --file postgres-backup.zip \
            --overwrite

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup
          path: postgres-backup.zip

  validate-upload:
    name: Validate Backup Upload
    runs-on: ubuntu-latest

    needs: backup-and-destroy

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Storage Account Key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "${{ env.RESOURCE_GROUP_NAME }}" \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --query "[0].value" \
            -o tsv)

          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Verify Backup Exists in Blob Storage
        run: |
          az storage blob exists \
            --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --account-key "${{ env.STORAGE_KEY }}" \
            --container-name "${{ env.CONTAINER_NAME }}" \
            --name "${{ needs.backup-and-destroy.outputs.backup_file }}"

  approval:
    name: Manual Approval
    runs-on: ubuntu-latest

    needs: validate-upload

    environment:
      name: production

    steps:
      - name: Await Manual Approval
        run: |
          echo "Backup validation completed successfully."
          echo "Waiting for manual approval before Terraform destroy."

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    needs: approval

    steps:
      - name: testing
        run: echo "Terraform destroy would be executed here after approval."
      
